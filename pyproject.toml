[project]
name = "kt-recourse-calibration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LiviaJonnatan", email = "jonnatanlivia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[project.scripts]
kt-recourse-calibration = "kt_recourse_calibration:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
